name: Docker build in push

# workflow se zažene ob vsakem pushu v vejo main
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # prenos kode iz repozitorija
      - name: Checkout code
        uses: actions/checkout@v4

      # priprava orodja za gradnjo Docker slik
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # prijava v Docker Hub s podatki iz GitHub secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # gradnja slike in pošiljanje na Docker Hub z dvema oznakama
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/turnirmanager:latest
            ${{ secrets.DOCKER_USERNAME }}/turnirmanager:${{ github.sha }}
